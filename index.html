<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | ExamPortal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #ddd6fe, #f5f3ff);
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(79, 70, 229, 0.15);
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 32px;
        }

        h1 {
            margin: 0 0 12px;
            color: #312e81;
            font-size: 28px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #dbe1f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #fafaff;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #eef2ff;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            margin-top: 5px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3730a3;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">✦</div>

        <h1>Student Login</h1>
        <p>Welcome back! Enter your details to start your examination.</p>

        <form action="/login" method="POST">
            <input
                type="text"
                name="student_name"
                placeholder="Enter Student Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">Login to Exam →</button>
        </form>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
